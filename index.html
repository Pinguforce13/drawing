<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Super Smooth Hand Drawing</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
        .webcam-container { position: absolute; bottom: 20px; right: 20px; width: 160px; height: 120px; border: 2px solid #333; z-index: 10; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    <div class="webcam-container"><video id="webcam" autoplay muted></video></div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('webcam');
        
        let paths = []; // Array van lijnen
        let currentPath = [];

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const finger = results.multiHandLandmarks[0][8];
                const x = (1 - finger.x) * canvas.width;
                const y = finger.y * canvas.height;
                currentPath.push({x, y});
            } else {
                if (currentPath.length > 0) paths.push(currentPath);
                currentPath = [];
            }
        }

        // De "Render Loop" voor extreme smoothness
        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; // Subtiel fade effect
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 8;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00ffcc';

            // Teken oude paden en het huidige pad
            [...paths, currentPath].forEach(path => {
                if (path.length < 2) return;
                ctx.beginPath();
                ctx.moveTo(path[0].x, path[0].y);
                
                // Beziér curves zorgen voor de vloeiende bochten
                for (let i = 1; i < path.length - 2; i++) {
                    const xc = (path[i].x + path[i + 1].x) / 2;
                    const yc = (path[i].y + path[i + 1].y) / 2;
                    ctx.quadraticCurveTo(path[i].x, path[i].y, xc, yc);
                }
                ctx.stroke();
            });
            requestAnimationFrame(draw);
        }

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 1, minDetectionConfidence: 0.8, minTrackingConfidence: 0.8 });
        hands.onResults(onResults);

        new Camera(video, { onFrame: async () => await hands.send({ image: video }), width: 640, height: 480 }).start();
        draw();
    </script>
</body>
</html>
