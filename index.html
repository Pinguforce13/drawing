<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Super Smooth Hand Drawing</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
        .webcam-container { position: absolute; bottom: 20px; right: 20px; width: 160px; height: 120px; border: 2px solid #333; border-radius: 8px; overflow: hidden; z-index: 10; background: #111; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    <div class="webcam-container"><video id="webcam" autoplay muted playsinline></video></div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('webcam');
        
        let paths = [];
        let currentPath = [];

        function resize() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }
        window.addEventListener('resize', resize);
        resize();

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const finger = results.multiHandLandmarks[0][8]; // Wijsvinger top
                // Omdat de webcam gespiegeld is, gebruiken we (1 - finger.x)
                const x = (1 - finger.x) * canvas.width;
                const y = finger.y * canvas.height;
                currentPath.push({x, y});
            } else {
                if (currentPath.length > 0) {
                    paths.push(currentPath);
                    currentPath = [];
                }
            }
        }

        function draw() {
            // Subtiel fade-effect voor de lichtspoor-look
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 8;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ffcc';

            const allPaths = [...paths, currentPath];

            allPaths.forEach(path => {
                if (path.length < 2) return;
                ctx.beginPath();
                ctx.moveTo(path[0].x, path[0].y);
                
                for (let i = 1; i < path.length - 1; i++) {
                    const xc = (path[i].x + path[i + 1].x) / 2;
                    const yc = (path[i].y + path[i + 1].y) / 2;
                    ctx.quadraticCurveTo(path[i].x, path[i].y, xc, yc);
                }
                ctx.stroke();
            });

            requestAnimationFrame(draw);
        }

        const hands = new Hands({ 
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` 
        });
        
        hands.setOptions({ 
            maxNumHands: 1, 
            modelComplexity: 1,
            minDetectionConfidence: 0.6, 
            minTrackingConfidence: 0.6 
        });
        
        hands.onResults(onResults);

        const camera = new Camera(video, {
            onFrame: async () => {
                await hands.send({ image: video });
            },
            width: 640,
            height: 480
        });
        
        camera.start().catch(err => {
            console.error("Kon de camera niet starten:", err);
            alert("Controleer of je webcam is aangesloten en geef toestemming in je browser.");
        });

        draw();
    </script>
</body>
</html>
